version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: avada-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-avada_db}
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    volumes:
      - avada_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-avada_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: avada-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 5005
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-avada_db}?schema=public
      JWT_SECRET: ${JWT_SECRET:-avada_super_secure_jwt_secret_key_2026_change_in_production}
    ports:
      - "5005:5005"

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: avada-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  avada_pgdata:
