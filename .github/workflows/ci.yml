name: CI/CD & Deployment

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------
  # Job 1: Quality Checks (Runs on every PR and Push to main)
  # -------------------------------------------------------------
  checks:
    name: Lint, Type Check & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Shared Package
        run: pnpm --filter @avada/shared build

      - name: Generate Prisma Client
        run: pnpm --filter @avada/api prisma:generate

      - name: Lint Check
        run: pnpm lint

      - name: TypeScript Type Check
        run: pnpm type-check

      - name: Production Build
        run: pnpm build

  # -------------------------------------------------------------
  # Job 2: Build & Push Docker Images to GHCR
  # (Strictly runs ONLY on direct push to main or manual dispatch)
  # -------------------------------------------------------------
  docker-build-push:
    name: Build & Push to GHCR (${{ matrix.name }})
    needs: [checks]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: docker/Dockerfile.api
            image: ghcr.io/${{ github.repository }}/api
          - name: web
            dockerfile: docker/Dockerfile.web
            image: ghcr.io/${{ github.repository }}/web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -------------------------------------------------------------
  # Job 3: Automated SSH Deployment to VPS
  # -------------------------------------------------------------
  deploy:
    name: Deploy to VPS
    needs: [docker-build-push]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          timeout: 1200s
          command_timeout: 20m
          script: |
            set -e

            echo "--- Navigating to Deployment Directory ---"
            mkdir -p ~/avada-website
            cd ~/avada-website

            # Authenticate Git with temporary GitHub Action token to pull latest compose
            if [ ! -d ".git" ]; then
              git init
              git remote add origin https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
            else
              git remote set-url origin https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
            fi
            git fetch origin main
            git reset --hard origin/main

            # Export tags for the compose file
            export API_TAG=latest
            export WEB_TAG=latest
            export GITHUB_REPOSITORY_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

            echo "--- Authenticating with GHCR ---"
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "--- Pulling New Images ---"
            docker compose pull api web

            echo "--- Ensuring Database & Environment ---"
            if [ ! -f ".env" ]; then
              cp .env.example .env 2>/dev/null || true
            fi
            docker compose up -d postgres

            echo "--- Running Database Schema Push & Seed ---"
            docker compose run --rm --entrypoint "npx prisma db push --accept-data-loss" api
            docker compose run --rm --entrypoint "npx tsx prisma/seed.ts" api

            echo "--- Starting Application ---"
            docker compose up -d --remove-orphans

            echo "✅ Deployment Successful! Services are up."

            echo "--- Cleaning Up Old Docker Images ---"
            docker image prune -a --force --filter "until=24h"

